  <text x="240" y="32" fill="#64748b" font-size="12">| Cockpit Voice &amp; Flight Data Recorder (CVFDR) Studio</text>
  
  <rect x="740" y="12" width="235" height="26" rx="13" fill="#064e3b" stroke="#10b981" stroke-width="1" />
  <circle cx="758" cy="25" r="5" fill="#10b981" />
  <text x="773" y="29" fill="#10b981" font-size="11" font-weight="bold">CSMU RECORDING LOCKED</text>

  <!-- Left Column: ARINC 717 & CSMU -->
