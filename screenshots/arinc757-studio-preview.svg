  <text x="355" y="213" fill="#10b981" font-size="14" font-weight="bold">298 kt</text>

  <rect x="460" y="175" width="100" height="50" rx="4" fill="#090d16" stroke="#1e293b" />
  <text x="470" y="192" fill="#94a3b8" font-size="9">ALTITUDE</text>
  <text x="470" y="213" fill="#10b981" font-size="14" font-weight="bold">35,000 ft</text>

  <rect x="575" y="175" width="100" height="50" rx="4" fill="#090d16" stroke="#1e293b" />
  <text x="585" y="192" fill="#94a3b8" font-size="9">NORMAL ACCEL</text>
  <text x="585" y="213" fill="#38bdf8" font-size="14" font-weight="bold">+1.02 G</text>

  <rect x="345" y="240" width="160" height="32" rx="4" fill="#0284c7" />
