  <text x="745" y="161" fill="#38bdf8" font-size="11" font-family="monospace">0x83C108C1 [ODD OK]</text>

  <text x="735" y="195" fill="#94a3b8" font-size="11">Label 302 (Elapsed Hours &amp; Rate):</text>
  <rect x="735" y="205" width="220" height="32" rx="4" fill="#0f172a" stroke="#1e293b" />
  <text x="745" y="226" fill="#38bdf8" font-size="11" font-family="monospace">0x812400C2 [ODD OK]</text>

