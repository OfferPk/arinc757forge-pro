  <rect x="345" y="470" width="330" height="40" rx="4" fill="#0f172a" />
  <text x="355" y="488" fill="#f8fafc" font-size="10">CH1 FO Headset: -18.2 dB • CH2 CAPT: -16.5 dB</text>
  <text x="355" y="502" fill="#38bdf8" font-size="10">CH3 CAM Area Mic: -22.1 dB (ACTIVE) • CH4 PA: STANDBY</text>

  <rect x="345" y="520" width="330" height="40" rx="4" fill="#059669" />
