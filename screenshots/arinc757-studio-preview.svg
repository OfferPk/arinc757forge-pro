  <text x="45" y="98" fill="#38bdf8" font-size="13" font-weight="bold">ARINC 717 SUBFRAME SYNC</text>
  
  <text x="45" y="130" fill="#f8fafc" font-size="12">Active Subframe:</text>
  <text x="160" y="130" fill="#10b981" font-size="12" font-weight="bold">SUBFRAME 1</text>
  
  <text x="45" y="160" fill="#f8fafc" font-size="12">Barker Code:</text>
  <text x="160" y="160" fill="#38bdf8" font-size="12" font-weight="bold">0x247 (SYNC OK)</text>

  <text x="45" y="190" fill="#f8fafc" font-size="12">Telemetry Rate:</text>
  <text x="160" y="190" fill="#f8fafc" font-size="11" font-weight="bold">256 Words / Sec</text>

  <text x="45" y="220" fill="#f8fafc" font-size="12">Elapsed Recording:</text>
  <text x="160" y="220" fill="#10b981" font-size="12" font-weight="bold">14.80 Hours</text>

  <rect x="45" y="250" width="240" height="40" rx="4" fill="#059669" />
  <text x="165" y="275" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">CSMU SYNC VERIFIED</text>

