  <text x="45" y="455" fill="#94a3b8" font-size="11">ULB Battery Reserve:</text>
  <text x="180" y="455" fill="#10b981" font-size="11" font-weight="bold">88.5 Days (90d Req)</text>

  <text x="45" y="485" fill="#94a3b8" font-size="11">Impact Rating:</text>
