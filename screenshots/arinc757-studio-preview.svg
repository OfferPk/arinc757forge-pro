  <rect x="365" y="410" width="6" height="40" fill="#0284c7" />
  <rect x="375" y="425" width="6" height="25" fill="#0284c7" />
  <rect x="385" y="390" width="6" height="60" fill="#ef4444" /> <!-- Harmonic Spike -->
