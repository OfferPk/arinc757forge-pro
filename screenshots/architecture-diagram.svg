<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" style="background:#0a0e17; font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,monospace;">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1f2937" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Title & Header -->
  <text x="40" y="45" fill="#38bdf8" font-size="20" font-weight="bold" letter-spacing="1">ARINC 757A SOLID-STATE COCKPIT VOICE &amp; FLIGHT DATA RECORDER (CVFDR)</text>
  <text x="40" y="70" fill="#94a3b8" font-size="12">ARINC 717 Subframe Barker Synchronization • 4-Channel CVR Audio • EUROCAE ED-112A Crash Survivability</text>
  <line x1="40" y1="85" x2="960" y2="85" stroke="#334155" stroke-width="1.5" />

  <!-- FDR & CVR SENSORS / AVIONICS INGESTION (LEFT) -->
  <rect x="40" y="105" width="440" height="445" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" />
  <rect x="40" y="105" width="440" height="32" rx="8" fill="#1e293b" />
  <circle cx="60" cy="121" r="5" fill="#38bdf8" filter="url(#glow)" />
  <text x="75" y="126" fill="#38bdf8" font-size="13" font-weight="bold">FLIGHT DATA &amp; COCKPIT VOICE ACQUISITION</text>

  <!-- ARINC 717 Telemetry Stream -->
  <rect x="55" y="147" width="410" height="85" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1" />
  <text x="68" y="167" fill="#10b981" font-size="11" font-weight="bold">ARINC 717 / 573 Digital Telemetry Stream</text>
  <text x="68" y="184" fill="#f8fafc" font-size="10">256 Words / Sec (12-bit words) • 4 Subframes per Major Frame</text>
  <text x="68" y="200" fill="#94a3b8" font-size="10">Barker Sync Codes: SF1=0x247 • SF2=0x5B8 • SF3=0xA47 • SF4=0xDB8</text>
  <text x="68" y="216" fill="#10b981" font-size="10">Pitch, Roll, Heading, CAS, Alt, Normal G, Engine N1, Control Surfaces</text>

  <!-- 4-Channel CVR Audio -->
  <rect x="55" y="242" width="410" height="85" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
  <text x="68" y="262" fill="#38bdf8" font-size="11" font-weight="bold">4-Channel Independent CVR Audio Acquisition</text>
  <text x="68" y="280" fill="#f8fafc" font-size="10">CH1: Pilot Flying (FO) • CH2: Pilot Monitoring (Captain)</text>
  <text x="68" y="296" fill="#94a3b8" font-size="10">CH3: Cockpit Area Mic (CAM) with FFT Acoustic Harmonic Extraction</text>
  <text x="68" y="312" fill="#38bdf8" font-size="10">CH4: Flight Deck PA / Observer Headset Audio</text>

  <!-- Impact Accelerometer Sensor -->
  <rect x="55" y="337" width="410" height="85" rx="4" fill="#0f172a" stroke="#ef4444" stroke-width="1" />
  <text x="68" y="357" fill="#ef4444" font-size="11" font-weight="bold">Inertial Crash Impact Sensor &amp; Flash Freeze</text>
  <text x="68" y="375" fill="#f8fafc" font-size="10">Automatic threshold detection (>3,400 G shock trigger)</text>
  <text x="68" y="391" fill="#94a3b8" font-size="10">Immediate memory write-inhibit freeze preserving final seconds</text>
  <text x="68" y="407" fill="#ef4444" font-size="10">Activates Underwater Locator Beacon (ULB) emergency ping</text>

  <!-- ARINC 429 Discrete Bus -->
  <rect x="55" y="432" width="410" height="105" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="68" y="452" fill="#94a3b8" font-size="11" font-weight="bold">ARINC 429 Glass-Cockpit Discrete Bus Output</text>
  <text x="68" y="472" fill="#38bdf8" font-size="10" font-family="monospace">Label 301: CVFDR BITE, Sync Lock &amp; CSMU Health [ODD OK]</text>
  <text x="68" y="492" fill="#38bdf8" font-size="10" font-family="monospace">Label 302: Elapsed Recording Duration (0-25 hrs) &amp; Rate [ODD OK]</text>
  <text x="68" y="512" fill="#10b981" font-size="10" font-weight="bold">Bit 32 Odd Parity Integrity Verified on Both Words</text>

  <!-- CRASH SURVIVABLE MEMORY UNIT & BEACON (RIGHT) -->
  <rect x="520" y="105" width="440" height="445" rx="8" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1.5" />
  <rect x="520" y="105" width="440" height="32" rx="8" fill="#78350f" opacity="0.6" />
  <circle cx="540" cy="121" r="5" fill="#f59e0b" filter="url(#glow)" />
  <text x="555" y="126" fill="#fcd34d" font-size="13" font-weight="bold">CRASH SURVIVABLE ENCLOSURE &amp; ULB BEACON</text>

  <!-- CSMU Flash Module -->
  <rect x="535" y="147" width="410" height="85" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1" />
  <text x="548" y="167" fill="#10b981" font-size="11" font-weight="bold">Crash Survivable Memory Unit (CSMU) Solid-State</text>
  <text x="548" y="184" fill="#f8fafc" font-size="10">16 GB Solid-State Flash • Continuous 25-Hour Cyclic Ring Buffer</text>
  <text x="548" y="200" fill="#94a3b8" font-size="10">Mandatory ICAO Annex 6 / EUROCAE ED-112A duration compliant</text>
  <text x="548" y="216" fill="#10b981" font-size="10">Wear-Leveling &amp; Reed-Solomon Error Correction Code (ECC)</text>

  <!-- Environmental Hardening -->
  <rect x="535" y="242" width="410" height="85" rx="4" fill="#0f172a" stroke="#ea580c" stroke-width="1" />
  <text x="548" y="262" fill="#ea580c" font-size="11" font-weight="bold">EUROCAE ED-112A Environmental Hardening</text>
  <text x="548" y="280" fill="#f8fafc" font-size="10">Impact Shock: 3,400 G for 6.5 ms • Penetration: 500 lb from 10 ft</text>
  <text x="548" y="296" fill="#94a3b8" font-size="10">High-Temp Fire: 1,100°C for 60 min • Low-Temp Fire: 260°C for 10 hrs</text>
  <text x="548" y="312" fill="#ea580c" font-size="10">Deep-Sea Hydrostatic Pressure: 8,700 psi (6,000m / 20,000 ft)</text>

  <!-- Underwater Locator Beacon -->
  <rect x="535" y="337" width="410" height="85" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
  <text x="548" y="357" fill="#38bdf8" font-size="11" font-weight="bold">Underwater Locator Beacon (ULB / TSO-C121b)</text>
  <text x="548" y="375" fill="#f8fafc" font-size="10">Operating Carrier Frequency: 37.5 kHz ± 1.0 kHz acoustic pulse</text>
  <text x="548" y="391" fill="#94a3b8" font-size="10">Pulse Length: 10.0 ms • Repetition Rate: 1.0 Hz (1 ping/sec)</text>
  <text x="548" y="407" fill="#38bdf8" font-size="10">Operating Battery Life: 90 Days Minimum (Mandated by ICAO)</text>

  <!-- Normative Compliance Scorecard -->
  <rect x="535" y="432" width="410" height="105" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1" />
  <text x="548" y="452" fill="#10b981" font-size="11" font-weight="bold">10-Point Normative Compliance Certification</text>
  <text x="548" y="472" fill="#f8fafc" font-size="10">ARINC Characteristic 757A • EUROCAE ED-112A • ICAO Annex 6</text>
  <text x="548" y="492" fill="#f8fafc" font-size="10">FAA TSO-C123b (CVR) • FAA TSO-C124b (FDR) • FAA TSO-C121b (ULB)</text>
  <text x="548" y="512" fill="#10b981" font-size="11" font-weight="bold">10 / 10 CHECKS PASSED (100% ARINC_757A_CVFDR_CERTIFIED)</text>

  <!-- Footer Banner -->
  <text x="500" y="575" fill="#64748b" font-size="11" text-anchor="middle">ARINC757Forge Pro v1.0.0 • Compliant with ARINC 757A, ARINC 717, EUROCAE ED-112A, FAA TSO-C123b/C124b &amp; ICAO Annex 6</text>
</svg>